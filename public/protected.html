<!doctype html><html><head><meta charset="utf-8"><title>Protected - MCYW</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/public/style.css"><script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script></head><body><div id="wm-overlay" style="position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:.12"></div><main class="container"><div style="display:flex;justify-content:space-between;align-items:center"><h1>รายชื่อเรือ / ข้อมูล</h1><div><button id="menuBtn" class="btn">☰</button></div></div><div style="margin-top:12px"><input id="title" placeholder="ชื่อรายการ" style="width:100%;padding:10px;border-radius:8px;background:#061221;border:1px solid #232" /><textarea id="content" rows="6" placeholder="รายละเอียด" style="width:100%;padding:10px;border-radius:8px;background:#061221;border:1px solid #232;margin-top:8px"></textarea><div style="display:flex;gap:8px;margin-top:8px"><select id="monthSelect"></select><select id="yearSelect"></select><button id="createEntry" class="btn">เพิ่มข้อมูล</button></div></div><div style="margin-top:12px;display:flex;justify-content:flex-end"><input type="file" id="fileInput" accept="image/png" style="display:none" /><button id="saveBtn" class="btn">บันทึก</button></div><div id="list" style="margin-top:18px"></div></main><script>if(!localStorage.getItem('mcyw_key')) location.href='/public/index.html';const FINGERPRINT=(function(){const nav=navigator;const s=[nav.userAgent,nav.language,screen.width+'x'+screen.height,(new Date()).getTimezoneOffset(),!!localStorage,!!sessionStorage,navigator.hardwareConcurrency||1].join('||');let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0}return 'fp_'+Math.abs(h).toString(36);})();const CURRENT_KEY=localStorage.getItem('mcyw_key');const CURRENT_USER=localStorage.getItem('mcyw_user')||'user';function applyWatermark(name){const c=document.createElement('canvas');c.width=600;c.height=140;const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);ctx.globalAlpha=.2;ctx.translate(300,70);ctx.rotate(-0.35);ctx.font='18px system-ui, Arial';ctx.textAlign='center';ctx.fillStyle='#000';ctx.fillText(name,0,0);document.getElementById('wm-overlay').style.backgroundImage='url('+c.toDataURL()+')';}applyWatermark(CURRENT_USER);for(let y=2023;y<=2032;y++){const opt=document.createElement('option');opt.value=y;opt.text=y;document.getElementById('yearSelect').appendChild(opt);}for(let m=1;m<=12;m++){const opt=document.createElement('option');opt.value=m;opt.text=m;document.getElementById('monthSelect').appendChild(opt);}async function loadEntries(){const m=Number(document.getElementById('monthSelect').value)||0;const y=Number(document.getElementById('yearSelect').value)||0;const r=await fetch(`/api/entries?key=${encodeURIComponent(CURRENT_KEY)}&month=${m}&year=${y}`);const j=await r.json();const list=document.getElementById('list');list.innerHTML='';(j.list||[]).forEach(it=>{const el=document.createElement('div');el.style.padding='12px';el.style.background='#081226';el.style.marginBottom='8px';el.innerHTML='<div style="font-weight:700">'+(it.title||'')+'</div><div style="margin-top:6px;white-space:pre-wrap">'+(it.content||'')+'</div>';list.appendChild(el);});}document.getElementById('createEntry').addEventListener('click',async ()=>{const title=document.getElementById('title').value;const content=document.getElementById('content').value;const m=Number(document.getElementById('monthSelect').value);const y=Number(document.getElementById('yearSelect').value);await fetch('/api/entry/create',{method:'POST',headers:{'Content-Type':'application/json','X-ACCESS-KEY':CURRENT_KEY},body:JSON.stringify({title,content,month:m,year:y,fingerprint:FINGERPRINT})});loadEntries();});document.getElementById('saveBtn').addEventListener('click',async ()=>{const userName=CURRENT_USER;applyWatermark(userName);const canvas=await html2canvas(document.body,{useCORS:true,scale:1});const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));const filename=(userName||'user')+'_capture_'+(new Date().toISOString().replace(/[:.]/g,'-'))+'.png';const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href);const fd=new FormData();fd.append('screenshot',blob,filename);fd.append('fingerprint',FINGERPRINT);const resp=await fetch('/api/save',{method:'POST',headers:{'X-ACCESS-KEY':CURRENT_KEY},body:fd});const j=await resp.json();if(j.ok)alert('ดาวน์โหลดสำเร็จ ข้อมูลถูกส่งไปยังระบบแล้ว');else alert('ดาวน์โหลดสำเร็จ แต่ส่งไประบบไม่สำเร็จ');});loadEntries();</script></body></html>

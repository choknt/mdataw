<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Admin - MCYW</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/public/style.css">
</head>
<body>
<main class="container">
<h1>Admin</h1>
<div>
<input id="adminSecret" placeholder="Admin Secret" />
<input id="name" placeholder="ชื่อในดิส/ไอดีเกม" />
<input id="userid" placeholder="userId (optional)" />
<label>
<input type="checkbox" id="isAdmin" /> Admin</label>
<button id="create" class="btn">สร้าง Key</button>
</div>
<pre id="out">
</pre>
<button id="listBtn" class="btn">รายการ Key</button>
<pre id="list">
</pre>
</main>
<script>document.getElementById('create').addEventListener('click',async ()=>{
const adminSecret=document.getElementById('adminSecret').value;
const name=document.getElementById('name').value;
const userId=document.getElementById('userid').value;
const isAdmin=document.getElementById('isAdmin').checked;
const r=await fetch('/api/admin/create-key',{
method:'POST',headers:{
'Content-Type':'application/json'}
,body:JSON.stringify({
admin_secret:adminSecret,name,userId,isAdmin}
)}
);
const j=await r.json();
document.getElementById('out').innerText=JSON.stringify(j,null,2);
}
);
document.getElementById('listBtn').addEventListener('click',async ()=>{
const adminSecret=document.getElementById('adminSecret').value;
const r=await fetch('/api/admin/list?admin_secret='+encodeURIComponent(adminSecret));
const j=await r.json();
document.getElementById('list').innerText=JSON.stringify(j.list,null,2);
}
);
</script>
</main>
</body>
</html>
